
# ============================================================
# Cloud Build CI/CD Pipeline — Enterprise HR RAG Platform
# Trigger: push to main branch
#
# Steps:
#   1. Unit tests (query router intent detection)
#   2. RAGAS regression gate (quality threshold check)
#   3. Build & push Docker image
#   4. Container vulnerability scan
#   5. Sign image with KMS (Binary Authorization)
#   6. Deploy to Cloud Run
#   7. Post-deploy smoke test
# ============================================================

steps:

  # ── Step 1: Unit Tests ───────────────────────────────────
  - name: 'python:3.11-slim'
    id: 'unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install pytest --quiet
        python -m pytest tests/test_query_router.py -v --tb=short
    waitFor: ['-']

  # ── Step 2: RAGAS Regression Gate ───────────────────────
  - name: 'python:3.11-slim'
    id: 'ragas-gate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        RAGAS_RELEVANCY_THRESHOLD=${_RAGAS_RELEVANCY_THRESHOLD} \
        RAGAS_PRECISION_THRESHOLD=${_RAGAS_PRECISION_THRESHOLD} \
        python tests/ragas_regression_gate.py
    waitFor: ['-']

  # ── Step 3: Build & Push Docker Image ───────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine:latest'
      - '.'
    waitFor: ['unit-tests', 'ragas-gate']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine'
    waitFor: ['build']

  # ── Step 4: Container Vulnerability Scan ────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'vuln-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Waiting for vulnerability scan results..."
        sleep 30
        SCAN=$(gcloud artifacts docker images describe \
          "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine:${SHORT_SHA}" \
          --show-package-vulnerability \
          --project="${PROJECT_ID}" \
          --format="json" 2>/dev/null || echo "{}")

        CRITICAL=$(echo "$$SCAN" | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        vulns = data.get('package_vulnerability_summary', {}).get('vulnerabilities', {})
        print(vulns.get('CRITICAL', 0))
        " 2>/dev/null || echo "0")

        echo "Critical CVEs found: $$CRITICAL"
        if [ "$$CRITICAL" -gt "0" ]; then
          echo "[FAIL] Critical vulnerabilities detected — blocking deployment"
          exit 1
        fi
        echo "[OK] No critical vulnerabilities"
    waitFor: ['push']

  # ── Step 5: Sign Image (Binary Authorization) ────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'sign'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DIGEST=$(gcloud container images describe \
          "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine:${SHORT_SHA}" \
          --project="${PROJECT_ID}" \
          --format="get(image_summary.digest)")
        echo "Signing image digest: $$DIGEST"
        gcloud beta container binauthz attestations sign-and-create \
          --artifact-url="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine@$$DIGEST" \
          --attestor="${_ATTESTOR}" \
          --attestor-project="${PROJECT_ID}" \
          --keyversion-project="${PROJECT_ID}" \
          --keyversion-location="${_REGION}" \
          --keyversion-keyring="${_KEYRING}" \
          --keyversion-key="${_SIGN_KEY}" \
          --keyversion=1 \
          --project="${PROJECT_ID}"
        echo "[OK] Image signed"
    waitFor: ['vuln-scan']

  # ── Step 6: Deploy to Cloud Run ──────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DIGEST=$(gcloud container images describe \
          "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine:${SHORT_SHA}" \
          --project="${PROJECT_ID}" \
          --format="get(image_summary.digest)")
        gcloud run deploy hr-rag-engine \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/hr-rag-engine@$$DIGEST" \
          --platform=managed \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --service-account="${_RAG_SA}" \
          --update-secrets="GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=hr-db-password:latest" \
          --set-env-vars="PROJECT_ID=${PROJECT_ID},ENVIRONMENT=${_ENVIRONMENT},REGION=${_REGION},DOCS_BUCKET=${_DOCS_BUCKET},DB_INSTANCE_NAME=${_DB_INSTANCE_NAME},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},RRF_ALPHA=${_RRF_ALPHA}" \
          --memory="${_MEMORY}" \
          --cpu="${_CPU}" \
          --min-instances="${_MIN_INSTANCES}" \
          --max-instances="${_MAX_INSTANCES}" \
          --binary-authorization=default \
          --quiet
        echo "[OK] Deployed revision to Cloud Run"
    waitFor: ['sign']

  # ── Step 7: Post-Deploy Smoke Test ───────────────────────
  - name: 'python:3.11-slim'
    id: 'smoke-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sleep 15
        SERVICE_URL=$(gcloud run services describe hr-rag-engine \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format="value(status.url)" 2>/dev/null)
        echo "Testing: $$SERVICE_URL"
        pip install --quiet urllib3
        python tests/smoke_test.py "$$SERVICE_URL"
    waitFor: ['deploy']

# ── Substitution defaults (overridden by trigger) ────────────
substitutions:
  _REGION:                   'asia-south1'
  _REGISTRY:                 'hr-rag-repo'
  _ENVIRONMENT:              'dev'
  _ATTESTOR:                 'hr-rag-attestor'
  _KEYRING:                  'hr-rag-keyring'
  _SIGN_KEY:                 'hr-rag-signing-key'
  _RAG_SA:                   'rag-engine-sa@hr-rag-dev.iam.gserviceaccount.com'
  _DOCS_BUCKET:              'hr-rag-dev-documents'
  _DB_INSTANCE_NAME:         'hr-rag-db'
  _DB_NAME:                  'hr_db'
  _DB_USER:                  'hr_admin'
  _RRF_ALPHA:                '0.5'
  _MEMORY:                   '2Gi'
  _CPU:                      '1'
  _MIN_INSTANCES:            '1'
  _MAX_INSTANCES:            '3'
  _RAGAS_RELEVANCY_THRESHOLD: '0.80'
  _RAGAS_PRECISION_THRESHOLD: '0.75'

options:
  logging:     CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
